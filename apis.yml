name: OpenGamma
description: >-
  OpenGamma is a derivatives and margin analytics company whose technology helps
  trading, risk, treasury and operations teams forecast, stress test, simulate and
  reduce the collateral and margin costs of trading cleared and bilateral
  derivatives. Its capabilities span Forecast, Stress Test, Simulate, Reduce,
  Allocate, Process, Explain, Validate and Comply. OpenGamma's public developer
  surface is Strata, its award-winning open-source (Apache 2.0) analytics and
  market-risk library for pricing and risk of OTC and exchange-traded derivatives,
  which also powers OpenGamma's commercial SaaS Analytics platform. Strata is a
  Java library published to Maven Central under com.opengamma.strata, with a
  bundled command-line tool, Javadoc reference and community forum; OpenGamma does
  not expose a public REST API. OpenGamma is backed by Accel and was acquired by
  Trading Technologies.
