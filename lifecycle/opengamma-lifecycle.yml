description: >-
  Lifecycle posture for OpenGamma's public developer surface, the Strata
  open-source analytics library. Strata is versioned as a released Java library on
  Maven Central (not a hosted, dated web API), so its lifecycle is expressed
  through library releases, semantic-style version tags, and the Apache 2.0
  license rather than through API version headers, Sunset/Deprecation HTTP
  headers, or a public status page.
